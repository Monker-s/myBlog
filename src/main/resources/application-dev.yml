      timeout: 3s
  mail:
    host: smtp.qq.com
    port: 587
    username: 2685986106@qq.com  # 替换为你的 QQ 邮箱地址
    password: wfdttaeosevudegd # 替换为 SMTP 授权码（不是邮箱密码）
    properties:
      mail:
        smtp:
          auth: true
