spring:
  datasource:
    url: jdbc:mysql://192.168.100.131/myblog?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: root
    password: a1143693967
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 192.168.100.131
      port: 6379
      database: 0
      timeout: 3s
